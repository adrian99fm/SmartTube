name: Build adrian99fm Stable AB

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/AdrianStable.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SmartTube 32.56 Stable original
        uses: actions/checkout@v4
        with:
          repository: yuliskov/SmartTube
          ref: 32.56s
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Personalizare identitate fara modificarea functiilor SmartTube
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          OLD = "org.smarttube.stable"
          NEW = "app.adrian99fm.smarttube"

          # Package separat: poate sta lângă SmartTube oficial.
          p = Path("smarttubetv/build.gradle")
          s = p.read_text(encoding="utf-8")
          old = 'ststable {\n            applicationId "org.smarttube.stable"'
          new = 'ststable {\n            applicationId "app.adrian99fm.smarttube"'
          if old not in s:
              raise SystemExit("Nu am gasit applicationId-ul Stable asteptat.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

          # Numele aplicației.
          p = Path("smarttubetv/src/ststable/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<string translatable="false" name="app_name"><![CDATA[SmartTube]]></string>',
              '<string translatable="false" name="app_name"><![CDATA[adrian99fm]]></string>'
          )
          s = s.replace(
              '<string translatable="false" name="browse_title"><![CDATA[SmartTube]]></string>',
              '<string translatable="false" name="browse_title"><![CDATA[adrian99fm]]></string>'
          )
          p.write_text(s, encoding="utf-8")

          # Android TV Search trebuie să folosească noul package.
          p = Path("leanbackassistant/src/ststable/res/values/strings.xml")
          s = p.read_text(encoding="utf-8")
          s = s.replace(OLD, NEW)
          s = s.replace(
              '<string name="search_label">SmartTube</string>',
              '<string name="search_label">adrian99fm</string>'
          )
          s = s.replace(
              '<string name="settings_description">SmartTube Videos</string>',
              '<string name="settings_description">adrian99fm Videos</string>'
          )
          p.write_text(s, encoding="utf-8")

          p = Path("leanbackassistant/src/ststable/res/xml/searchable.xml")
          p.write_text(p.read_text(encoding="utf-8").replace(OLD, NEW), encoding="utf-8")

          # Firebase-ul oficial este legat de org.smarttube.stable.
          g = Path("smarttubetv/google-services.json")
          if g.exists():
              g.unlink()
          PY

      - name: Inlocuieste toate siglele S cu A.B.
        shell: bash
        run: |
          set -e

          echo '' | base64 --decode > /tmp/ab_icon.png
          echo '' | base64 --decode > /tmp/ab_logo.png
          echo '' | base64 --decode > /tmp/ab_banner.png

          # Iconițe launcher.
          cp /tmp/ab_icon.png smarttubetv/src/ststable/res/mipmap-nodpi/app_icon.png
          cp /tmp/ab_icon.png smarttubetv/src/ststable/res/mipmap-nodpi-v30/app_icon.png
          cp /tmp/ab_icon.png smarttubetv/src/main/res/mipmap-nodpi/app_icon.png
          cp /tmp/ab_icon.png smarttubetv/src/main/res/mipmap-nodpi/app_icon_alt.png

          # Banner Android TV.
          cp /tmp/ab_banner.png smarttubetv/src/ststable/res/mipmap-nodpi/app_banner.png
          cp /tmp/ab_banner.png smarttubetv/src/main/res/mipmap-nodpi/app_banner.png

          # Sigla din interfață, inclusiv variantele roșie/gri folosite de teme.
          cp /tmp/ab_logo.png smarttubetv/src/ststable/res/mipmap-nodpi/app_logo.png
          cp /tmp/ab_logo.png smarttubetv/src/ststable/res/mipmap-nodpi/app_logo_semi_red.png
          cp /tmp/ab_logo.png smarttubetv/src/ststable/res/mipmap-nodpi/app_logo_semi_grey.png
          cp /tmp/ab_logo.png smarttubetv/src/main/res/mipmap-nodpi/app_logo.png
          cp /tmp/ab_logo.png smarttubetv/src/main/res/mipmap-nodpi/app_logo_semi_red.png
          cp /tmp/ab_logo.png smarttubetv/src/main/res/mipmap-nodpi/app_logo_semi_grey.png

      - name: Forteaza sigla A.B. in coltul din dreapta sus
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          p = Path("smarttubetv/src/main/java/com/liskovsoft/smartyoutubetv2/tv/ui/browse/BrowseFragment.java")
          s = p.read_text(encoding="utf-8")

          line1 = '        Drawable bridgeIcon = Utils.getDrawable(getContext(), splashPresenter.getBridgePackageName(), "app_icon");'
          line2 = '        setBadgeDrawable(bridgeIcon != null ? bridgeIcon : appLogoRes > 0 ? ContextCompat.getDrawable(getContext(), appLogoRes) : null);'
          repl2 = '        setBadgeDrawable(appLogoRes > 0 ? ContextCompat.getDrawable(getContext(), appLogoRes) : null);'

          if line1 not in s:
              raise SystemExit("Nu am gasit linia bridgeIcon.")
          if line2 not in s:
              raise SystemExit("Nu am gasit linia setBadgeDrawable.")

          s = s.replace(line1, '        // Bridge icon dezactivat: folosim mereu sigla A.B. proprie.', 1)
          s = s.replace(line2, repl2, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Configureaza semnatura fixa verificata
        shell: bash
        run: |
          set -e
          echo '' | base64 --decode > "${{ github.workspace }}/adrian99fm.jks"

          # Verificare înainte de compilare: dacă cheia nu poate fi citită, build-ul se oprește aici.
          keytool -list             -keystore "${{ github.workspace }}/adrian99fm.jks"             -storepass 'Adrian99fm-AB-2026!'             -alias 'adrian99fm' > /dev/null

          cat > keystore.properties <<EOF
          storePassword=Adrian99fm-AB-2026!
          keyAlias=adrian99fm
          keyPassword=Adrian99fm-AB-2026!
          storeFile=${{ github.workspace }}/adrian99fm.jks
          EOF

      - name: Build SmartTube Stable personalizat
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleStstableRelease

      - name: Pregateste APK universal
        shell: bash
        run: |
          set -e
          APK=$(find smarttubetv/build/outputs/apk/ststable/release -type f -name "*_universal.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK universal nu a fost gasit."
            find smarttubetv/build/outputs/apk/ststable/release -type f -maxdepth 1 -print || true
            exit 1
          fi
          cp "$APK" adrian99fm.apk
          ls -lh adrian99fm.apk

      - name: Salveaza APK ca artifact
        uses: actions/upload-artifact@v4
        with:
          name: adrian99fm-Stable-AB
          path: adrian99fm.apk
          if-no-files-found: error

      - name: Publica APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="adrian99fm-stable-ab-${{ github.run_number }}"
          gh release create "$TAG" adrian99fm.apk             --repo "${{ github.repository }}"             --title "adrian99fm Stable 32.56 A.B."             --notes "SmartTube 32.56 Stable original, package separat, toate siglele S inlocuite cu A.B. verde electric."             --latest
